app = "cesiumhub"
primary_region = "iad"

[build]
  [build.args]
    NODE_VERSION = "20"

[http_service]
  internal_port = 3000
  force_https = true

[env]
  PORT = "3000"

[[services]]
  internal_port = 3000
  protocol = "tcp"
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
  [[services.ports]]
    port = 80
    handlers = ["http"]
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]